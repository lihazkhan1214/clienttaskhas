<!DOCTYPE html>
<html lang="">
<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.18.0/axios.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background: #faf7f2; color: #2f2a24; }
    button { padding: 8px 16px; margin-right: 8px; border: none; border-radius: 6px; background: #8a5a3b; color: #fff; cursor: pointer; }
    button:hover { background: #6b4329; }
    img { width: 400px; max-width: 100%; border-radius: 8px; }
  </style>
  <title>How Bout'Em</title>
</head>

<body>
  <div id="app">
    <button v-on:click="showme('cocker')">Cocker</button>
    <button v-on:click="showme('brittany')">Brittany</button>

    <div v-if="moreData.length > 0">
      <h3>{{ whichDawg.toUpperCase() }} SPANIEL</h3>
      <a :href="moreData[selector]" target="_blank">
        <img :src="moreData[selector]" alt="Current spaniel image">
      </a>
      <br>
      <button v-on:click="slider()">Next</button>
    </div>
  </div>

  <script src="slideshow.js"></script>
</body>
</html>
